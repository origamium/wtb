services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-app_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    volumes:
      - cache_data:/data # excluded from cloning via wtb.yaml

volumes:
  db_data: # cloned (or freshly seeded with --seed)
  cache_data: # excluded by wtb.yaml (regenerable)
  shared_assets:
    external: true # skipped automatically (shared across worktrees by design)
